[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fusion-native-mcp"
version = "0.2.0"
description = "Tracked MCP execution through Autodesk Fusion's native desktop server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["fusion360", "autodesk-fusion", "mcp", "cad", "cam"]
requires-python = ">=3.11"
dependencies = ["mcp==1.30.0", "httpx==0.28.1", "pydantic>=2.11,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
fusion-native-mcp = "fusion_native_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fusion_native_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/examples", "/docs", "/skills",
  "/README.md", "/LICENSE", "/CONTRIBUTING.md", "/ROADMAP.md",
  "/SECURITY.md", "/CHANGELOG.md", "/EXISTING_MODELS.md", "/HANDOFF.md",
  "/pyproject.toml", "/run.py", "/setup.ps1", "/mcp-config.example.json"
]
